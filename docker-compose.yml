services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scripture}
      POSTGRES_DB: scriptures
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Bind mount under the project dir (./data), NOT a named volume:
    # named volumes live outside $HOME and are wiped when the VM is replaced.
    # :z keeps SELinux (Fedora etc.) happy; ignored elsewhere.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scriptures"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama:z
      - ./models:/models:ro,z
    # GPU passthrough (uncomment on hosts with NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
